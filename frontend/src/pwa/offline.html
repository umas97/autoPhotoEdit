<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>autoPhotoEdit non è in esecuzione</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #111111; color: #d4d4d4;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; text-align: left; }
      h1 { font-size: 1.25rem; font-weight: 600; color: #f5f5f5; margin: 0 0 0.75rem; }
      p { line-height: 1.6; margin: 0 0 0.75rem; }
      code {
        background: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 0.25rem;
        padding: 0.1rem 0.4rem; font-size: 0.9em;
      }
      button {
        margin-top: 1rem; background: #2d2d2d; color: #f5f5f5; border: 1px solid #3f3f3f;
        border-radius: 0.375rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer;
      }
      button:hover { background: #3f3f3f; }
    </style>
  </head>
  <body>
    <main>
      <h1>autoPhotoEdit non è in esecuzione</h1>
      <p>
        L'interfaccia è qui, ma il programma che sviluppa le foto è spento: senza di
        lui non c'è né catalogo né anteprima.
      </p>
      <p>Riavvialo con <code>autophotoedit</code>, poi ricarica questa pagina.</p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
